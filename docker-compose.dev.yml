# Dev en parallèle de la prod (admin-panel sur 3010, admin-panel-dev sur le même port interne).
# Prod : npm run docker:prod  |  Dev : npm run docker:dev  |  Stop dev : npm run docker:dev:stop
# URL prod : https://vps.graphandco.com  |  Dev : https://dev.vps.graphandco.com
services:
  admin-panel-dev:
    build:
      context: .
      dockerfile: Dockerfile.dev
    image: admin-panel-dev:local
    pull_policy: never
    container_name: admin-panel-dev
    restart: unless-stopped
    networks:
      - web-network
    volumes:
      - .:/app
      - admin-node-modules:/app/node_modules
      - admin-next:/app/.next
      - ./invoices:/app/invoices
      - ./contracts:/app/contracts
      - ./quotes:/app/quotes
    env_file:
      - .env
    environment:
      NODE_ENV: development
      NEXT_PUBLIC_PANEL_MODE: development
      PORT: 3010
      HOSTNAME: 0.0.0.0
      INVOICES_DIR: /app/invoices
      CONTRACTS_DIR: /app/contracts
      QUOTES_DIR: /app/quotes

volumes:
  admin-node-modules:
  admin-next:

networks:
  web-network:
    external: true
